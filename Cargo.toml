[package]
name = "lattes-app"
version = "1.0.0"
edition = "2021"

[lib]
name = "lattes_app"
path = "src/lib.rs"

[[bin]]
name = "lattes-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "functions"] }
calamine = { version = "0.26", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
opener = "0.7"
rfd = "0.15"
regex = "1.10"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
quick-xml = "0.31"
pdf-extract = "0.12"
ureq = { version = "2", features = ["json"] }
rust_xlsxwriter = "0.102"
zip = { version = "=2.1.0", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
