[package]
name = "lattes-app"
version = "1.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "lattes_app"
path = "src/lib.rs"

[[bin]]
name = "lattes-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled", "chrono", "functions"] }
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", features = ["serde"] }
opener = "0.7"
rfd = "0.15"
regex = "1.10"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
quick-xml = "0.41"
pdf-extract = "0.12"
lopdf = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = { version = "2", features = ["json"] }
rust_xlsxwriter = "0.102"
zip = { version = "9.8", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

[dev-dependencies]
tempfile = "3"
