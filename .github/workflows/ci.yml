# Testes automáticos em cada push e pull request, nos três sistemas.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --all-targets

      # Informativos até o código ser formatado e os avisos zerados; depois, remover continue-on-error.
      - name: Formatação (rustfmt)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo fmt --check

      - name: Lint (clippy)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
