# Testes automáticos em cada push e pull request, nos três sistemas.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Versão fixa: cada Rust novo pode trazer lints novos do clippy, que bloqueia o CI.
      # Para atualizar, troque o número aqui e rode `cargo clippy --all-targets` localmente.
      - name: Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100"
          components: clippy, rustfmt

      - name: Cache do Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Testes
        run: cargo test --all-targets

      - name: Formatação (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint (clippy)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
