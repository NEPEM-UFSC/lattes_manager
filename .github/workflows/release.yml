# Instaladores do Lattes Manager para Windows, macOS (Intel + Apple Silicon) e Linux.
# Dispara ao enviar uma tag "v*" (ex.: git tag v1.0.0 && git push --tags) ou manualmente
# em Actions › "Instaladores" › Run workflow. Os arquivos ficam num rascunho de Release.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis --config tauri.updater.conf.json"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg --config tauri.updater.conf.json"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage --config tauri.updater.conf.json"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release recebe o nome da versão do tauri.conf.json: uma tag que não bate com ela
      # mandaria os instaladores para outra release (ex.: tag v1.2.0 com versão 1.1.0).
      - name: Conferir tag × versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(jq -r .version tauri.conf.json)
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME tauri.conf.json=$VERSION Cargo.toml=$CARGO"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $VERSION (tauri.conf.json) / $CARGO (Cargo.toml). Atualize os dois arquivos, faça commit e recrie a tag."
            exit 1
          fi

      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm

      - name: Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache do Rust
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # CLI pré-compilado via npm (Node já vem nos runners): evita compilar o tauri-cli
      # do zero, que é lento e quebrava no macOS.
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.4

      # Atualização automática: com tauri.updater.conf.json, o build gera a assinatura (.sig) de
      # cada instalador com a chave privada do segredo TAURI_SIGNING_PRIVATE_KEY, e o
      # tauri-action publica o latest.json que o app consulta. A chave pública correspondente
      # está em tauri.conf.json › plugins.updater.pubkey.
      - name: Compilar e publicar no rascunho de Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          tagName: v__VERSION__
          releaseName: "Lattes Manager v__VERSION__"
          releaseBody: "Instaladores para Windows (.exe), macOS (.dmg universal) e Linux (.deb, .rpm, .AppImage)."
          releaseDraft: true
          args: ${{ matrix.args }}

      # ---------- Assinatura de código do instalador do Windows (SignPath Foundation) ----------
      # Só roda quando a variável SIGNPATH_ORGANIZATION_ID está configurada no repositório
      # (Settings › Secrets and variables › Actions). Sem ela, o instalador sai sem assinatura,
      # como antes. Configuração: variáveis SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_POLICY_SLUG (ex.: release-signing) e o segredo SIGNPATH_API_TOKEN.
      - name: Enviar instalador não assinado (para o SignPath)
        id: nao-assinado
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-nao-assinado
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe

      - name: Assinar no SignPath
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.nao-assinado.outputs.artifact-id }}
          wait-for-completion: true
          # a assinatura pela Foundation exige aprovação manual no SignPath: até 1 h de espera
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: assinado

      # Troca o instalador pelo assinado: no rascunho da Release (mesmo nome, --clobber) e na
      # pasta do bundle, para que o artefato, o SHA256SUMS.txt e o atestado usem o assinado.
      # A assinatura do SignPath muda o arquivo, então a assinatura do atualizador (.sig) é
      # refeita sobre o instalador assinado; o latest.json é corrigido no job final.
      - name: Publicar instalador assinado
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(jq -r .version tauri.conf.json)
          ls -l assinado
          for f in assinado/*.exe; do
            dest="target/release/bundle/nsis/$(basename "$f")"
            cp -f "$f" "$dest"
            gh release upload "v$VERSION" "$dest" --clobber --repo "$GITHUB_REPOSITORY"
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              rm -f "$dest.sig"
              tauri signer sign "$dest"
              gh release upload "v$VERSION" "$dest.sig" --clobber --repo "$GITHUB_REPOSITORY"
            fi
          done

      # Cópia dos instaladores como artefato da execução (Actions › execução › Artifacts).
      # Útil em execuções manuais, como entrada das somas e do atestado (job abaixo) —
      # no Windows, já o assinado pelo SignPath, quando configurado.
      - name: Guardar instaladores como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instaladores-${{ runner.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Somas SHA-256 e atestado de origem do GitHub dos instaladores dos três sistemas.
  # Conferir um download:  sha256sum -c SHA256SUMS.txt --ignore-missing
  # Conferir a origem:     gh attestation verify <arquivo> --repo NEPEM-UFSC/lattes_manager
  somas-e-atestado:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # anexar o SHA256SUMS.txt ao rascunho da release
      actions: read
      id-token: write # atestado de origem (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar os instaladores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: instaladores-*
          path: artefatos

      - name: Gerar SHA256SUMS.txt
        run: |
          mkdir -p instaladores
          find artefatos -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} instaladores/ \;
          cd instaladores
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Anexar SHA256SUMS.txt ao rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version tauri.conf.json)
          gh release upload "v$VERSION" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      # O latest.json (atualização automática) foi montado durante os builds, com a assinatura
      # do instalador do Windows ainda sem o SignPath. Aqui ela é trocada pela assinatura do
      # instalador final (o .sig refeito no job do Windows).
      - name: Corrigir latest.json (Windows assinado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version tauri.conf.json)
          SIG=$(find artefatos -name '*-setup.exe.sig' | head -n1)
          if [ -z "$SIG" ] || ! gh release download "v$VERSION" -p latest.json -D upd --repo "$GITHUB_REPOSITORY"; then
            echo "Sem latest.json ou sem .sig do Windows; nada a corrigir."
            exit 0
          fi
          jq --arg sig "$(cat "$SIG")"             '.platforms |= with_entries(if (.key | startswith("windows-")) and (.value.url | endswith("-setup.exe")) then .value.signature = $sig else . end)'             upd/latest.json > latest.json
          jq '.platforms | keys' latest.json
          gh release upload "v$VERSION" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Atestado de origem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS.txt
